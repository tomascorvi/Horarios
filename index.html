<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Horarios - Ramos & Devoto</title>
    
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f0f2f5; color: #333; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; max-width: 1300px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; min-width: 350px; }
        h2, h3 { color: #2c3e50; margin-top: 0; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .checkbox-group { display: flex; gap: 15px; padding: 10px 0; }
        
        /* Tabla de disponibilidad */
        .tabla-dispo { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.8em; }
        .tabla-dispo th, .tabla-dispo td { border: 1px solid #eee; padding: 8px; text-align: center; }
        .tabla-dispo th { background: #f8f9fa; }
        .indisponible-cell { background-color: #ffebee; cursor: pointer; color: #c0392b; font-weight: bold; }
        .disponible-cell { background-color: #e8f5e9; cursor: pointer; color: #27ae60; }
        
        /* Botones */
        .btn-primary { background: #3498db; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 6px; width: 100%; font-weight: bold; margin-bottom: 10px; }
        .btn-generate { background: #e67e22; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 6px; width: 100%; font-weight: bold; margin-top: 20px; }
        .btn-excel { background: #27ae60; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 6px; width: 100%; font-weight: bold; margin-top: 10px; }
        
        /* Resultado */
        .resultado-tabla { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        .resultado-tabla th, .resultado-tabla td { border: 1px solid #ccc; padding: 10px; text-align: center; font-size: 0.85em; }
        .badge { background: #ecf0f1; padding: 2px 6px; border-radius: 4px; font-size: 0.75em; }
        
        #listaControl li:hover { background-color: #f9f9f9; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>1. Registro de Empleada</h2>
        <div class="input-group">
            <label>Nombre:</label>
            <input type="text" id="nombre" placeholder="Ej: Maria Perez">
        </div>
        <div class="input-group">
            <label>Rol:</label>
            <select id="rol">
                <option value="Vendedor">Vendedor/a</option>
                <option value="Encargado">Encargado/a</option>
            </select>
        </div>
        <div class="input-group">
            <label>Horas Semanales a cumplir:</label>
            <input type="number" id="horas" placeholder="Ej: 40">
        </div>
        <div class="input-group">
            <label>Sucursales donde trabaja:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" id="checkDevoto"> Devoto</label>
                <label><input type="checkbox" id="checkRamos"> Ramos</label>
            </div>
        </div>

        <label>Disponibilidad (Marcá lo que NO puede):</label>
        <table class="tabla-dispo" id="tablaRestricciones">
            <thead>
                <tr><th>Turno</th><th>Lun</th><th>Mar</th><th>Mie</th><th>Jue</th><th>Vie</th><th>Sáb</th><th>Dom</th></tr>
            </thead>
            <tbody>
                <tr id="filaManana"><td><b>Mañana</b></td></tr>
                <tr id="filaTarde"><td><b>Tarde</b></td></tr>
            </tbody>
        </table>
        <br>
        <button class="btn-primary" onclick="guardarEmpleada()">AGREGAR A NÓMINA</button>
        <button class="btn-generate" onclick="generarHorario()">✨ GENERAR HORARIO SEMANAL</button>
        <button class="btn-excel" onclick="exportarExcel()">📥 DESCARGAR EXCEL</button>
    </div>

    <div class="card">
        <h3>2. Control de Nómina</h3>
        <div id="listaControl" style="background: #fdfdfd; border: 1px solid #eee; padding: 10px; border-radius: 8px; margin-bottom: 20px; max-height: 250px; overflow-y: auto;">
            <p style="color: #999; font-style: italic;">No hay empleadas cargadas aún...</p>
        </div>

        <h3>3. Horario Generado</h3>
        <div id="output" style="overflow-x: auto;">
            <p style="color: #666;">El horario aparecerá aquí debajo.</p>
        </div>
        <div id="resumenHoras" style="margin-top:20px; padding-top:10px; border-top: 1px dashed #ccc;"></div>
    </div>
</div>

<script>
    let empleadas = [];
    let ultimoHorarioGenerado = null;
    const dias = ["Lun", "Mar", "Mie", "Jue", "Vie", "Sáb", "Dom"];

    // Inicializar tabla de clics
    function init() {
        ['filaManana', 'filaTarde'].forEach(filaId => {
            const fila = document.getElementById(filaId);
            for(let i=0; i<7; i++) {
                const td = document.createElement('td');
                td.classList.add('disponible-cell');
                td.innerText = "SÍ";
                td.dataset.dia = dias[i];
                td.dataset.turno = filaId === 'filaManana' ? 'Mañana' : 'Tarde';
                td.onclick = function() {
                    if(this.innerText === "SÍ") {
                        this.innerText = "NO";
                        this.classList.replace('disponible-cell', 'indisponible-cell');
                    } else {
                        this.innerText = "SÍ";
                        this.classList.replace('indisponible-cell', 'disponible-cell');
                    }
                };
                fila.appendChild(td);
            }
        });
    }

    function guardarEmpleada() {
        const nombre = document.getElementById('nombre').value.trim();
        const rol = document.getElementById('rol').value;
        const horas = document.getElementById('horas').value;
        const locales = [];
        if(document.getElementById('checkDevoto').checked) locales.push("Devoto");
        if(document.getElementById('checkRamos').checked) locales.push("Ramos");

        if(!nombre || !horas || locales.length === 0) return alert("Por favor, completa nombre, horas y locales.");

        // Evitar duplicados
        if(empleadas.find(e => e.nombre.toLowerCase() === nombre.toLowerCase())) return alert("Esta empleada ya existe.");

        const restricciones = [];
        document.querySelectorAll('.indisponible-cell').forEach(c => {
            restricciones.push({ dia: c.dataset.dia, turno: c.dataset.turno });
        });

        empleadas.push({ 
            nombre, 
            rol, 
            horas: parseInt(horas), 
            locales, 
            restricciones, 
            horasAsignadas: 0 
        });
        
        actualizarListaLateral();
        resetForm();
    }

    function actualizarListaLateral() {
        const contenedor = document.getElementById('listaControl');
        if (empleadas.length === 0) {
            contenedor.innerHTML = '<p style="color: #999; font-style: italic;">No hay empleadas cargadas aún...</p>';
            return;
        }

        let html = '<ul style="list-style: none; padding: 0; margin: 0;">';
        empleadas.forEach((e, index) => {
            html += `
                <li style="padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong style="color:#2980b9">${e.nombre}</strong> <small>(${e.rol})</small><br>
                        <small>Locales: ${e.locales.join(", ")} | <b>Meta: ${e.horas}hs</b></small>
                    </div>
                    <button onclick="eliminarEmpleada(${index})" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75em;">Borrar</button>
                </li>`;
        });
        html += '</ul>';
        contenedor.innerHTML = html;
    }

    function eliminarEmpleada(index) {
        if(confirm("¿Eliminar a " + empleadas[index].nombre + "?")) {
            empleadas.splice(index, 1);
            actualizarListaLateral();
        }
    }

    function resetForm() {
        document.getElementById('nombre').value = "";
        document.getElementById('horas').value = "";
        document.getElementById('checkDevoto').checked = false;
        document.getElementById('checkRamos').checked = false;
        document.querySelectorAll('.indisponible-cell').forEach(c => {
            c.innerText = "SÍ";
            c.classList.replace('indisponible-cell', 'disponible-cell');
        });
    }

    function generarHorario() {
        if(empleadas.length < 2) return alert("Carga más empleadas para cubrir los turnos.");
        
        let horario = { Devoto: {}, Ramos: {} };
        empleadas.forEach(e => e.horasAsignadas = 0);

        dias.forEach(dia => {
            ["Devoto", "Ramos"].forEach(local => {
                
                // REGLA: Ramos cerrado los domingos
                if (local === "Ramos" && dia === "Dom") {
                    horario[local][dia] = { Mañana: ["CERRADO"], Tarde: ["CERRADO"] };
                    return;
                }

                horario[local][dia] = { Mañana: [], Tarde: [] };
                
                ["Mañana", "Tarde"].forEach(turno => {
                    // Excepción Devoto Mañana Lun-Mie (Solo Encargado)
                    let necesitaVendedor = true;
                    if(local === "Devoto" && turno === "Mañana" && ["Lun", "Mar", "Mie"].includes(dia)) necesitaVendedor = false;

                    // 1. Asignar Encargado
                    let enc = buscarMejorCandidata(dia, turno, local, "Encargado");
                    if(enc) {
                        horario[local][dia][turno].push(enc.nombre);
                        sumarHoras(enc, local, dia, turno);
                    }

                    // 2. Asignar Vendedor
                    if(necesitaVendedor) {
                        let vend = buscarMejorCandidata(dia, turno, local, "Vendedor", enc ? enc.nombre : null);
                        if(!vend) vend = buscarMejorCandidata(dia, turno, local, "Encargado", enc ? enc.nombre : null);
                        
                        if(vend) {
                            horario[local][dia][turno].push(vend.nombre);
                            sumarHoras(vend, local, dia, turno);
                        }
                    }
                });
            });
        });

        ultimoHorarioGenerado = horario;
        dibujarTabla(horario);
    }

    function buscarMejorCandidata(dia, turno, local, rol, yaAsignadoNombre) {
        let posibles = empleadas.filter(e => {
            const puedeLocal = e.locales.includes(local);
            const tieneRol = e.rol === rol;
            const disponible = !e.restricciones.some(r => r.dia === dia && r.turno === turno);
            const noDobleEnMismoTurno = yaAsignadoNombre ? e.nombre !== yaAsignadoNombre : true;
            const tieneHorasPendientes = e.horasAsignadas < (e.horas + 2); // Margen pequeño

            return puedeLocal && tieneRol && disponible && noDobleEnMismoTurno && tieneHorasPendientes;
        });

        // Equilibrio de carga: Priorizar a la que menos horas trabajó
        posibles.sort((a, b) => a.horasAsignadas - b.horasAsignadas);
        return posibles[0] || null;
    }

    function sumarHoras(e, local, dia, turno) {
        let h = 5; // Default Ramos (10-15 o 15-20)
        if(local === "Devoto") {
            if(turno === "Mañana") h = 5.5; // 10-15:30
            else h = (dia === "Vie" || dia === "Sáb") ? 6.5 : 5.5; // 15:30-22 o 15:30-21
        }
        e.horasAsignadas += h;
    }

    function dibujarTabla(h) {
        let html = `<table class="resultado-tabla"><tr><th>Local</th><th>Turno</th>${dias.map(d=>`<th>${d}</th>`).join('')}</tr>`;
        ["Devoto", "Ramos"].forEach(l => {
            ["Mañana", "Tarde"].forEach(t => {
                html += `<tr><td style="background:#f9f9f9"><b>${l}</b></td><td>${t}</td>`;
                dias.forEach(d => {
                    const staff = h[l][d][t];
                    const esCerrado = staff.includes("CERRADO");
                    html += `<td style="${esCerrado ? 'color:#999; background:#eee' : ''}">${staff.join("<br>") || "<span style='color:red'>VACÍO</span>"}</td>`;
                });
                html += `</tr>`;
            });
        });
        html += "</table>";
        document.getElementById('output').innerHTML = html;

        let res = "<h4>Resumen de cumplimiento de horas:</h4><div style='display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:10px;'>";
        empleadas.forEach(e => {
            const porcentaje = Math.round((e.horasAsignadas / e.horas) * 100);
            res += `<div style='padding:5px; border-left:3px solid #3498db; background:#f4f4f4'>
                        <b>${e.nombre}</b>: ${e.horasAsignadas}hs / ${e.horas}hs<br>
                        <small>Progreso: ${porcentaje}%</small>
                    </div>`;
        });
        res += "</div>";
        document.getElementById('resumenHoras').innerHTML = res;
    }

    function exportarExcel() {
        if(!ultimoHorarioGenerado) return alert("Generá el horario primero.");
        const wb = XLSX.utils.book_new();
        let datos = [["SISTEMA DE HORARIOS SEMANAL"], [], ["Local", "Turno", ...dias]];
        
        ["Devoto", "Ramos"].forEach(l => {
            ["Mañana", "Tarde"].forEach(t => {
                let fila = [l, t];
                dias.forEach(d => fila.push(ultimoHorarioGenerado[l][d][t].join(", ")));
                datos.push(fila);
            });
        });

        const ws = XLSX.utils.aoa_to_sheet(datos);
        XLSX.utils.book_append_sheet(wb, ws, "Horarios");
        XLSX.writeFile(wb, "Horarios_Ramos_Devoto.xlsx");
    }

    init();
</script>
</body>
</html>
